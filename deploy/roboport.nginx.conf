# nginx-конфиг для Roboport.
# Положить в /etc/nginx/sites-available/roboport, слинковать в sites-enabled.
# install.sh подставляет cert paths и server_name автоматически (через sed).
#
# === Auth-модель ===
# Внутренний auth панели (scrypt + TOTP + CSRF + IP-bans) сам прикрывает
# периметр. nginx basic-auth — ОПЦИОНАЛЬНЫЙ второй слой для интернет-доступа.
# В этом конфиге basic-auth ВЫКЛЮЧЕН по умолчанию (раскомментируй блок ниже,
# если хочешь добавить — install.sh умеет создать .htpasswd через
# NGINX_HTPASSWD_PASS env-переменную).
#
# === TLS ===
# Конфиг настроен под TLS на :443. install.sh либо генерит self-signed
# (deploy/gen-self-signed.sh), либо ставит nginx без cert и юзер запускает
# `certbot --nginx -d <domain>` сам — certbot сам отредактирует ssl_*
# директивы под себя.
#
# === Подмены при установке (install.sh sed) ===
#   __SERVER_NAME__   — domain или IP (по умолчанию `_` = catch-all)
#   __PROJECT_DIR__   — корень репы (для location /static/)
#   __SSL_CERT__      — путь к cert.pem
#   __SSL_KEY__       — путь к key.pem

upstream roboport {
    server 127.0.0.1:__UVICORN_PORT__;
    keepalive 16;
}

# server_name=_ во всех блоках — catch-all. Cert SAN + Avahi mDNS дают
# реальное «по какому имени я отвечаю». nginx просто проксирует. Это
# проще для пользователя: при смене локального имени или добавлении
# global-домена через certbot ничего в server_name править не надо.

# Legacy :8000 → 301 на HTTPS. Старые URL `http://host:8000/...` продолжают
# работать (через редирект). uvicorn слушает loopback на другом порту,
# так что nginx может занять 8000 catch-all.
server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTP :80 → редирект на HTTPS :443.
# Если TLS не настроен (cert paths пустые), install.sh заменит этот блок
# на простой proxy без редиректа (см. блок «HTTP-only fallback» ниже).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge для Let's Encrypt — пропускаем без редиректа.
    # certbot пишет файлы в /var/www/certbot/.well-known/acme-challenge/.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — основная точка входа.
# Note: используем старый синтаксис `listen 443 ssl http2;` (nginx <1.25)
# вместо нового `http2 on;` — Ubuntu 22.04 идёт с nginx 1.18, новая
# директива там «unknown directive http2». Старый синтаксис работает на
# обоих (deprecated на 1.25+ но не убран).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ----- TLS -----
    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # Modern TLS (Mozilla 2024 intermediate). Поддерживает TLS 1.2+ для всех
    # современных клиентов. Self-signed cert работает с этим набором.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:Roboport:10m;
    ssl_session_tickets off;

    # OCSP stapling — для self-signed выключаем (нет реального issuer'а).
    # Для Let's Encrypt — certbot включит сам после --nginx.
    # ssl_stapling        on;
    # ssl_stapling_verify on;

    # HSTS — после первой загрузки браузер запоминает «только HTTPS». Внутренний
    # auth панели в security_headers_middleware тоже HSTS выставляет, но nginx
    # покрывает и не-app пути (/static, /.well-known).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Лимит размера тела для загрузки сейвов/модов. Большие сейвы бывают 50+ МБ.
    client_max_body_size 200M;

    # Логи отдельно — удобнее искать.
    access_log /var/log/nginx/roboport.access.log;
    error_log  /var/log/nginx/roboport.error.log;

    # Опциональный второй слой — basic-auth. По умолчанию выключен (внутренний
    # auth панели сам прикрывает). Раскомментируй если хочешь.
    # auth_basic           "Roboport";
    # auth_basic_user_file /etc/nginx/.roboport.htpasswd;

    location / {
        proxy_pass http://roboport;

        # Стандартные headers для FastAPI с --proxy-headers/--forwarded-allow-ips.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;   # https — наш auth_routes._is_https() это понимает
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade — нужен для /ws/servers/<uuid>/logs (live-консоль).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WS-сессия живёт пока юзер на странице; даём ей долго не дёргаться.
        # docker logs -f не шлёт keepalive, но мы держим коннект открытым.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;   # для стрима логов важно
    }

    # Статика — отдаётся прямо nginx-ом (минуя upstream).
    location /static/ {
        alias __PROJECT_DIR__/app/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }
}
